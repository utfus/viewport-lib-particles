[package]
name = "viewport-lib-particles"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "GPU particle and VFX system for viewport-lib: modifier graph, WGSL codegen, lit and shadowed particle draw"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/utfus/viewport-lib-particles"
homepage = "https://github.com/utfus/viewport-lib-particles"
documentation = "https://docs.rs/viewport-lib-particles"
keywords = ["3d", "particles", "vfx", "viewport", "viewport-lib"]
categories = ["graphics", "rendering"]

[dependencies]
viewport-lib = { path = "../viewport-lib", version = "0.19" }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "27.0"

[dev-dependencies]
pollster = "0.4"
# eframe 0.33 pairs with wgpu 27, matching viewport-lib's primary leg.
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[[example]]
name = "particles-minimal"
path = "examples/particles_minimal.rs"

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
