[package]
name = "viewport-lib-particles"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "GPU particle and VFX system for viewport-lib: modifier graph, WGSL codegen, lit and shadowed particle draw"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/utfus/viewport-lib-particles"
homepage = "https://github.com/utfus/viewport-lib-particles"
documentation = "https://docs.rs/viewport-lib-particles"
keywords = ["3d", "particles", "vfx", "viewport", "viewport-lib"]
categories = ["graphics", "rendering"]

[dependencies]
viewport-lib-types = { path = "../viewport-lib/crates/viewport-lib-types", version = "0.2" }
viewport-lib = { path = "../viewport-lib/crates/viewport-lib", version = "0.22", optional = true }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "27.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
ron = { version = "0.8", optional = true }

[features]
default = ["gpu"]
# The particle and refraction plugins, their pipelines and shaders. Off, the
# crate holds only the effect authoring model and the item types, built against
# viewport-lib-types alone, with neither viewport-lib nor wgpu in the tree.
gpu = ["dep:viewport-lib", "dep:wgpu"]
# Effect serialization: serde derives on the asset model plus RON `.effect`
# round-trip helpers. Off by default so the base crate stays dependency-light.
serde = ["dep:serde", "dep:ron"]

[dev-dependencies]
pollster = "0.4"
# eframe 0.33 pairs with wgpu 27, matching viewport-lib's primary leg.
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[[example]]
name = "particles-minimal"
path = "examples/particles_minimal.rs"

[[example]]
name = "showcase"
path = "examples/showcase/main.rs"
